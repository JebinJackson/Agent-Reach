name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      - name: Run tests
        run: |
          pytest -q

      - name: Type-check
        run: |
          mypy agent_reach

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Run tests
        shell: bash
        run: |
          export PATH="/c/Program Files/Git/bin:/c/Program Files/Git/usr/bin:$PATH"
          pytest -q

  # Editable installs (-e) never exercise wheel packaging, so a broken wheel
  # can pass tests and still fail every real `pip install` from source.
  # This job builds the actual wheel and installs it into a clean venv.
  wheel-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel has no duplicate entries and ships data files
        run: |
          python - <<'PY'
          import glob, zipfile, collections
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          dupes = [n for n, c in collections.Counter(names).items() if c > 1]
          assert not dupes, f"duplicate entries in wheel: {dupes}"
          for path in (
              "agent_reach/skill/SKILL.md",
              "agent_reach/skill/SKILL_en.md",
              "agent_reach/skill/references/sessions.md",
              "agent_reach/skill/references/maintenance.md",
              "agent_reach/skill/references/capabilities.md",
          ):
              assert path in names, f"{path} missing from wheel"
          assert "agent_reach/channels/xiaoyuzhou.py" in names
          assert "agent_reach/scripts/transcribe_xiaoyuzhou.sh" in names
          for retired in ("agent_reach/mcp_server.py", "agent_reach/runtime/ask.py",
                          "agent_reach/backends/cloak_worker.py", "agent_reach/runtime/opencli_compat.py"):
              assert retired not in names, f"retired module remains in wheel: {retired}"
          print(f"wheel OK: {len(names)} entries, no duplicates, data files present")
          PY

      - name: Smoke-install wheel into clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/agent-reach version
          cd /tmp && /tmp/smoke/bin/agent-reach channels | /tmp/smoke/bin/python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['channels'], d; print(f\"channels OK: {len(d['channels'])}\")"
          cd /tmp && /tmp/smoke/bin/python -c "import agent_reach; from importlib.resources import files; assert (files('agent_reach')/'skill'/'SKILL.md').is_file(); print('SKILL.md ships in site-packages OK')"
